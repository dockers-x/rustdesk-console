name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Build the admin SPA once and share it with every target build.
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - name: Build admin web UI
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: resources/admin

  binaries:
    needs: webui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked || true
      - name: Pull in admin UI
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: resources/admin
      - name: Build (${{ matrix.target }})
        env:
          RUSTDESK_CONSOLE_BUILD_REVISION: ${{ github.sha }}
        run: |
          cross build --locked --release --target ${{ matrix.target }} -p rustdesk-console
      - name: Package
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/rustdesk-console release/
          cp -r conf release/
          mkdir -p release/data release/runtime
          tar -C release -czf rustdesk-console-${{ matrix.target }}.tar.gz .
          sha256sum rustdesk-console-${{ matrix.target }}.tar.gz > rustdesk-console-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-console-${{ matrix.target }}
          path: |
            rustdesk-console-${{ matrix.target }}.tar.gz
            rustdesk-console-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rustdesk-console-${{ matrix.target }}.tar.gz
            rustdesk-console-${{ matrix.target }}.tar.gz.sha256

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-console-*-unknown-linux-musl
          path: release-packages
          merge-multiple: true
      - name: Prepare image binaries
        run: |
          set -euo pipefail
          (cd release-packages && sha256sum --check ./*.sha256)
          mkdir -p release-binaries/{amd64,arm64}
          tar -xOf release-packages/rustdesk-console-x86_64-unknown-linux-musl.tar.gz ./rustdesk-console > release-binaries/amd64/rustdesk-console
          tar -xOf release-packages/rustdesk-console-aarch64-unknown-linux-musl.tar.gz ./rustdesk-console > release-binaries/arm64/rustdesk-console
          chmod 755 release-binaries/{amd64,arm64}/rustdesk-console
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_REVISION=${{ github.sha }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-console:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rustdesk-console:${{ github.ref_name }}
