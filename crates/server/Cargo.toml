[package]
name = "rustdesk-console"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
default-run = "rustdesk-console"

[[bin]]
name = "rustdesk-console"
path = "src/main.rs"

[dependencies]
entity = { path = "../entity" }
rustdesk-client-config = { path = "../rustdesk-client-config" }
rustdesk-server-control = { path = "../rustdesk-server-control" }
rustdesk-uri = { path = "../rustdesk-uri" }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
futures-util = "0.3"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rand = { workspace = true }
ring = "0.17.14"
uuid = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
captcha = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
maxminddb = { workspace = true }
flate2 = "1"
tar = { version = "0.4", default-features = false }
fs2 = { workspace = true }
ldap3 = { workspace = true }
rustls = "0.21"
rustls-native-certs = "0.6"
rustls-pemfile = "1"
urlencoding = { workspace = true }
url = { workspace = true }
lettre = { workspace = true }
png = "0.17.16"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
age = { version = "0.11.2", default-features = false }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rsa = "0.9.10"
